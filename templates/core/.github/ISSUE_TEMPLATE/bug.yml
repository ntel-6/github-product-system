name: Ошибка
description: Сообщить о воспроизводимой проблеме
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: Версия продукта, ОС и релевантная конфигурация без секретов.
  - type: checkboxes
    id: safety
    attributes:
      label: Безопасность
      options:
        - label: Я удалил пароли, токены, ключи и персональные данные.
          required: true
