name: Улучшение
description: Предложить проверяемое улучшение продукта
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какая проблема решается
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Желаемый результат
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии готовности
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы и ограничения
